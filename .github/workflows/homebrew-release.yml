name: Homebrew release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homebrew-release
  cancel-in-progress: false

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RAW_TAG"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches pyproject version
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # pyproject.toml is the single source of truth for the version. A v-tag
          # must match it, or the Homebrew package would report a different version
          # than the tag (e.g. a v0.1.4 tag installing openbird==0.1.0). Bump
          # pyproject before tagging.
          pyproject_version="$(awk -F'"' '/^version = / {print $2; exit}' pyproject.toml)"
          if [[ "$VERSION" != "$pyproject_version" ]]; then
            echo "Tag version ($VERSION) != pyproject.toml version ($pyproject_version)." >&2
            echo "Bump pyproject.toml to $VERSION on main before pushing the v$VERSION tag." >&2
            exit 1
          fi
          echo "Tag and pyproject agree on version $VERSION."

      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="openbird-${{ steps.release.outputs.version }}.tar.gz"
          python3 scripts/build_source_archive.py \
            --version "${{ steps.release.outputs.version }}" \
            --output "$RUNNER_TEMP/$archive"
          sha256="$(sha256sum "$RUNNER_TEMP/$archive" | awk '{print $1}')"
          echo "archive=$archive" >> "$GITHUB_ENV"
          echo "archive_path=$RUNNER_TEMP/$archive" >> "$GITHUB_ENV"
          echo "archive_sha256=$sha256" >> "$GITHUB_ENV"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Auto-generate notes from the conventional-commit history since the
          # previous v* tag, so the source release stops shipping a bare stub
          # (v0.3.0 did). Fall back to the stub if there is no prior tag or the
          # generator is unavailable at this commit / produces nothing.
          notes_file="$RUNNER_TEMP/notes.md"
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          {
            echo "Source release for the Homebrew CLI channel (\`brew install openbird\`)."
            echo
            if [[ -n "$prev_tag" ]] \
              && python3 scripts/gen_changelog.py --from "$prev_tag" --to "$TAG" > "$RUNNER_TEMP/changes.md" 2>/dev/null \
              && [[ -s "$RUNNER_TEMP/changes.md" ]]; then
              echo "## What's new since ${prev_tag}"
              echo
              cat "$RUNNER_TEMP/changes.md"
            fi
          } > "$notes_file"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # --latest=false: this is the Homebrew *source* release, not the
            # headline download. Without it, gh defaults to "automatic" and marks
            # the newest release Latest, silently displacing the notarized
            # beta-dmg-* release testers are meant to land on. Keep it explicit.
            gh release create "$TAG" \
              --verify-tag \
              --latest=false \
              --title "OpenBird $TAG" \
              --notes-file "$notes_file"
          fi

          # Idempotent, non-destructive upload. `gh release upload --clobber`
          # deletes the existing asset before re-uploading, so a failed
          # re-upload would lose the asset the live formula URL points at.
          # Instead: upload when absent, skip when byte-identical, and fail
          # loudly when an asset with the same name exists but differs.
          existing_url="$(
            gh release view "$TAG" \
              --json assets \
              --jq ".assets[] | select(.name == \"$archive\") | .url" \
            | head -n1
          )"
          if [[ -z "$existing_url" ]]; then
            gh release upload "$TAG" "$archive_path"
          else
            existing_path="$RUNNER_TEMP/existing-$archive"
            gh release download "$TAG" --pattern "$archive" --output "$existing_path" --clobber
            existing_sha="$(sha256sum "$existing_path" | awk '{print $1}')"
            if [[ "$existing_sha" == "$archive_sha256" ]]; then
              echo "Release asset $archive already present and byte-identical; skipping upload."
            else
              echo "Release asset $archive already exists for $TAG with a different sha256." >&2
              echo "  existing: $existing_sha" >&2
              echo "  built:    $archive_sha256" >&2
              echo "Refusing to overwrite a published asset." >&2
              exit 1
            fi
          fi

      - name: Checkout default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0
          # persist-credentials defaults to true; keep it so the formula-bump
          # branch push below is authenticated via the checkout action's token.
          # No hand-built Authorization header is required (and none must be
          # added: `set -x` on such a step would leak the token).

      - name: Update formula
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_homebrew_formula.py \
            --version "${{ steps.release.outputs.version }}" \
            --sha256 "$archive_sha256"

      - name: Verify the formula edit before opening the PR
        # The formula-bump PR is bot-authored via GITHUB_TOKEN, so it never
        # triggers CI (recursion suppression) — #115 merged entirely unvalidated.
        # Validate the bot's edit inline instead: the formula must now pin THIS
        # release's source tarball URL and the exact sha256 we just built and
        # published. A mismatch means update_homebrew_formula.py misfired; fail
        # loudly rather than open a PR that ships a wrong/unfetchable archive.
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected_url="releases/download/v${VERSION}/openbird-${VERSION}.tar.gz"
          if ! grep -qF "$expected_url" Formula/openbird.rb; then
            echo "::error::Formula URL does not reference the v${VERSION} archive ($expected_url)." >&2
            exit 1
          fi
          if ! grep -qF "sha256 \"${archive_sha256}\"" Formula/openbird.rb; then
            echo "::error::Formula sha256 does not match the built archive (${archive_sha256})." >&2
            exit 1
          fi
          echo "Formula correctly pins v${VERSION} and sha256 ${archive_sha256}."

      - name: Open formula-bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/openbird.rb; then
            echo "Formula already current; no pull request needed."
            exit 0
          fi

          branch="homebrew/formula-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit the bump on a throwaway bot branch, never on main. Branch
          # protection / required review on main is therefore preserved.
          git checkout -b "$branch"
          git add Formula/openbird.rb
          git commit -m "chore(homebrew): update formula for ${TAG}"
          # --force-with-lease is safe for this deterministic, bot-owned branch
          # (a re-run for the same tag updates its own branch) and never
          # rewrites a branch someone else advanced.
          git push --force-with-lease origin "$branch"

          # Note: `gh pr list --head` does not support owner-qualified
          # (`owner:branch`) syntax, so the head is the plain branch name; the
          # branch lives in this same repository.
          existing_pr="$(gh pr list --state open --base main --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Open formula PR already exists: $existing_pr (branch updated in place)."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore(homebrew): update formula for ${TAG}" \
            --body "Automated Homebrew formula bump for \`${TAG}\`. Updates the source archive URL and sha256 in \`Formula/openbird.rb\`. Merge to publish the new release to Homebrew users."
