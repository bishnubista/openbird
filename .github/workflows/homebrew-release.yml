name: Homebrew release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: homebrew-release
  cancel-in-progress: false

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RAW_TAG"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="openbird-${{ steps.release.outputs.version }}.tar.gz"
          python3 scripts/build_source_archive.py \
            --version "${{ steps.release.outputs.version }}" \
            --output "$RUNNER_TEMP/$archive"
          sha256="$(sha256sum "$RUNNER_TEMP/$archive" | awk '{print $1}')"
          echo "archive=$archive" >> "$GITHUB_ENV"
          echo "archive_path=$RUNNER_TEMP/$archive" >> "$GITHUB_ENV"
          echo "archive_sha256=$sha256" >> "$GITHUB_ENV"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --verify-tag \
              --title "OpenBird $TAG" \
              --notes "Source release for Homebrew."
          fi
          gh release upload "$TAG" "$archive_path" --clobber

      - name: Checkout default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Update formula
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_homebrew_formula.py \
            --version "${{ steps.release.outputs.version }}" \
            --sha256 "$archive_sha256"

      - name: Commit formula update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/openbird.rb; then
            echo "Formula already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/openbird.rb
          git commit -m "chore(homebrew): update formula for ${{ steps.release.outputs.tag }}"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin HEAD:main
