name: CI

# Manual-only CI. OpenBird is pre-production and hosted GitHub Actions are
# currently billing-disabled by choice, so auto-running this on every push/PR
# only produces runs that fail at job startup and add noise. Until production,
# the authoritative pre-merge gates are the LOCAL ones (`uv run python -m pytest
# -q`, ShellCheck, `swift build`) plus the Codex/CodeRabbit reviews. Trigger a
# hosted run by hand from the Actions tab (or `gh workflow run CI`) when a
# cross-check on a clean runner is actually wanted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (dev extra, locked)
        run: uv sync --extra dev --frozen
      - name: Run test suite
        # CI-safe path: fake capture/model providers, no TCC, no signed helper,
        # no Ollama, no network. Ollama-dependent tests auto-skip when absent.
        run: uv run python -m pytest -q

  encryption-gate:
    name: Encryption gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (encryption extra, locked)
        # sqlcipher3-wheels ships prebuilt macOS universal2 wheels, so no system
        # build deps (OpenSSL/SQLCipher toolchain) are needed on the runner.
        run: uv sync --extra encryption --frozen
      - name: Run encryption gate
        # CI-safe: the gate monkeypatches the key provider, so it never touches
        # the macOS Keychain and needs no network. It proves the real OpenBird
        # SQLCipher opener (WAL, sqlite-vec, 0o600 perms, encrypted backup,
        # disabled extension loading) works end-to-end.
        run: uv run --extra encryption python scripts/encryption_gate.py

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest # pure metadata check; no macOS toolchain needed
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Assert uv.lock agrees with pyproject.toml
        # pyproject.toml is the source of truth, but uv.lock pins the project's
        # own version too. A bump that edits only pyproject leaves the lock stale
        # (the #112/#113 regression). `uv lock --check` fails if the lockfile is
        # out of date; the explicit compare gives a self-describing error and a
        # pointer to the fix. Keep both — belt and suspenders on the release gate.
        run: |
          uv lock --check
          pyproject_v="$(awk -F'"' '/^version = / {print $2; exit}' pyproject.toml)"
          lock_v="$(grep -A1 '^name = "openbird"$' uv.lock \
            | awk -F'"' '/^version = / {print $2; exit}')"
          echo "pyproject.toml=$pyproject_v  uv.lock=$lock_v"
          if [ "$pyproject_v" != "$lock_v" ]; then
            echo "::error::pyproject.toml ($pyproject_v) and uv.lock ($lock_v) disagree. Run script/bump_version.sh <x.y.z> and commit both files." >&2
            exit 1
          fi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck on shell scripts
        run: shellcheck script/*.sh

  homebrew-style:
    name: Homebrew style
    runs-on: macos-latest # brew is preinstalled here; brew style needs no setup
    steps:
      - uses: actions/checkout@v5
      - name: Lint the Homebrew formula and cask
        # Static `brew style` (rubocop) over the packaging files. Nothing in CI
        # used to lint these, so the Homebrew/FormulaPathMethods offense fixed in
        # #116 sat on main since before v0.2.0. Run it on every PR so hand-edits
        # to the formula/cask can't reintroduce style debt.
        run: brew style Formula/openbird.rb Casks/openbird.rb

  swift-helpers:
    name: Swift helpers build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build capture + audio helpers
        # Both target .macOS(.v13), so they build on the stock runner SDK.
        # The mac-app target is intentionally NOT built here: it uses Liquid
        # Glass (macOS 26) APIs that require a build SDK newer than GitHub's
        # hosted runners currently provide. Re-add it once macos runners ship
        # the macOS 26 SDK.
        run: |
          for pkg in capture-helper audio-helper; do
            echo "::group::swift build $pkg"
            ( cd "$pkg" && swift build )
            echo "::endgroup::"
          done
