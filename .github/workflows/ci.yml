name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # Lint is platform-independent, so run it on the cheap/fast runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install lint deps
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    # OpenBird targets macOS (AX, ScreenCaptureKit, launchd, Keychain), so the
    # test suite runs on macOS — the only platform it is verified against.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        # Skip the torch-pulling extras (meetings, rerank): their heavy code
        # paths are behind try-imports and the tests that need them auto-skip.
        run: uv sync --extra dev --extra encryption --extra integrations
      - name: Run tests
        # Integration tests (e.g. a live Ollama) auto-skip when unavailable.
        run: uv run pytest -q
