# Machine-readable companion to docs/design/privacy-data-flow.md.
# Keep route ids stable; tests and UI copy may reference them.
version: 1
route_classes:
  local:
    description: Runtime data stays on this Mac.
    egress: false
  self-hosted-remote:
    description: Data leaves this Mac for user-controlled infrastructure.
    egress: true
  third-party-cloud:
    description: Data leaves this Mac for a third-party provider.
    egress: true
  unknown:
    description: OpenBird cannot prove the route.
    egress: true
    release_green: false

release_policy:
  public_beta_requires_verified_sqlcipher: true
  plaintext_0600_release_green: false
  unknown_route_release_green: false

routes:
  - id: capture.active_window
    class: local
    source: Swift Accessibility helper
    captured_fields:
      - bundle_id
      - window_title_sanitized_before_storage
      - active_window_text
      - timestamp
      - incognito_flag
    storage:
      - sqlite.observations
      - sqlite.content_blobs
      - sqlite.chunks
      - sqlite.fts_chunks
      - sqlite.vec_chunks
    egress:
      default: none
      inherited_by:
        - chat.remote
        - routines.summary
    deletion:
      command: openbird data purge/prune
      must_remove:
        - observations
        - orphaned_content_blobs
        - orphaned_chunks
        - fts_rows
        - vector_rows
    truth_surface:
      - app.capture_state
      - preflight.privacy

  - id: capture.pause
    class: local
    source: capture.paused sidecar
    captured_fields: []
    storage: []
    egress:
      default: none
    enforcement:
      boundary: Swift helper before AX read
      failure_mode: fail_closed
    truth_surface:
      - app.capture_pause_state
      - menu_bar.pause_state

  - id: ingest.files
    class: local
    source: user-selected local files
    captured_fields:
      - extracted_text
      - source_path_metadata
      - timestamp
    storage:
      - sqlite.observations
      - sqlite.content_blobs
      - sqlite.chunks
      - sqlite.fts_chunks
      - sqlite.vec_chunks
    egress:
      default: none
      inherited_by:
        - embedding.remote
        - chat.remote
    truth_surface:
      - cli.ingest_output

  - id: chat.local
    class: local
    source: user prompt plus retrieved local memory
    captured_fields:
      - user_question
      - retrieved_chunks
      - citations
    storage: []
    egress:
      condition: active_model_route_is_loopback
      default: none
    truth_surface:
      - cli.cloud_banner
      - app.privacyTransmissionSummary

  - id: deep_brain.preview
    class: local
    source: exclusion-filtered day/week memory plus selected cited snippets
    captured_fields:
      - distilled_day_memory_content
      - distilled_day_or_week_memory_content
      - period_metadata
      - selected_citation_snippets
      - selected_source_observation_id
      - selected_source_app
      - selected_source_window_or_url
      - selected_source_timestamp
      - packet_build_route
      - exclusion_counts
      - opt_in_gate_status
    storage: []
    egress:
      default: none
      note: local preview only; no provider is constructed
    truth_surface:
      - cli.deep_brain_preview

  - id: deep_brain.ask
    class: unknown
    source: user question plus exclusion-filtered day/week memory packet
    captured_fields:
      - user_question
      - distilled_day_memory_content
      - distilled_day_or_week_memory_content
      - period_metadata
      - selected_citation_snippets
      - selected_source_observation_id
      - selected_source_app
      - selected_source_window_or_url
      - selected_source_timestamp
      - generated_answer
      - validated_citations
      - exclusion_counts
    storage: []
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      warning: packet content leaves this machine when the active model route is remote
    enforcement:
      feature_requires: OPENBIRD_DEEP_BRAIN_ENABLED
      note: Feature gate covers Deep Brain ask and productivity coaching.
    truth_surface:
      - cli.deep_brain_ask
      - cli.CLOUD_ACTIVE

  - id: productivity.local_facts
    class: local
    source: deterministic day-memory metrics and source references
    captured_fields:
      - active_seconds
      - active_minutes
      - context_switch_count
      - context_switches_per_active_hour
      - top_category
      - top_hour
      - focus_blocks
      - category_sources
      - source_ids
      - coach_ready_packet_without_source_ids
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
    storage:
      - sqlite.day_memories
    egress:
      default: none
      note: no provider is constructed; coaching packets are local read-time projections
    truth_surface:
      - cli.productivity

  - id: productivity.coach
    class: unknown
    source: user question plus exclusion-filtered sanitized local productivity facts packet
    captured_fields:
      - user_question
      - productivity_facts
      - synthetic_citation_ids
      - generated_coaching
      - validated_citations_local_source_ids
      - exclusion_counts
      - exclusion_metadata
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
      - source_ids_in_prompt
      - observation_ids_in_prompt
    storage: []
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      warning: sanitized productivity facts leave this machine when the active model route is remote
    enforcement:
      feature_requires: OPENBIRD_DEEP_BRAIN_ENABLED
      note: Same frontier-reasoning gate as Deep Brain ask; cloud egress still requires OPENBIRD_ALLOW_CLOUD when the active LLM is remote.
    truth_surface:
      - cli.productivity_coach
      - cli.CLOUD_ACTIVE

  - id: chat.remote
    class: unknown
    source: user prompt plus retrieved local memory
    captured_fields:
      - user_question
      - retrieved_chunks
      - citations
    storage:
      - local_db_for_retrieval_only
    egress:
      default: active_model_route
      resolved_by:
        - model.remote_ollama
        - model.third_party_cloud
      warning: captured memory leaves this machine
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: routines.summary
    class: unknown
    source: scheduled time-window retrieval over local memory
    captured_fields:
      - retrieved_window_memory
      - routine_prompt
      - generated_summary
    storage:
      - routine_output_store_when_enabled
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
    truth_surface:
      - routine_run_output
      - cli.cloud_banner

  - id: meetings.audio
    class: local
    status: planned
    source: ScreenCaptureKit/audio helper
    captured_fields:
      - audio_frames
      - transcript_text
      - speaker_metadata
    storage:
      - local_transcript_store_when_enabled
      - sqlite.observations
      - sqlite.content_blobs
      - sqlite.chunks
    egress:
      default: none
      remote_stt_requires_future_route: true
    truth_surface:
      - preflight.audio
      - app.meeting_privacy_state

  - id: model.local_ollama
    class: local
    source: retrieved memory and user prompt
    egress:
      condition: ollama_host_is_loopback
      default: none
    truth_surface:
      - preflight.cloud
      - cli.cloud_banner
      - app.privacyTransmissionSummary

  - id: model.remote_ollama
    class: self-hosted-remote
    source: retrieved memory and user prompt
    egress:
      condition: ollama_host_is_not_loopback
      default: off_device
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: model.third_party_cloud
    class: third-party-cloud
    source: retrieved memory and user prompt
    egress:
      condition: provider_is_not_local
      default: third_party_provider
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: embedding.remote
    class: unknown
    source: local memory chunks sent for embedding
    captured_fields:
      - chunk_text
      - embedding_request_metadata
    storage:
      - sqlite.vec_chunks
    egress:
      default: active_embedding_route
      resolved_by:
        - model.remote_ollama
        - model.third_party_cloud
      warning: captured chunks leave this machine
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE

  - id: rerank.remote
    class: unknown
    source: user query plus retrieved local memory chunks sent to a cross-encoder
    captured_fields:
      - user_question
      - retrieved_chunk_text
      - rerank_request_metadata
    storage:
      - local_db_for_retrieval_only
    egress:
      condition: rerank_host_is_not_loopback
      default: active_rerank_route
      resolved_by:
        - model.remote_ollama
        - model.third_party_cloud
      warning: query and candidate chunk text leave this machine
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: diagnostics.logs
    class: local
    source: runtime diagnostics
    captured_fields:
      - reason_codes
      - counts
      - safe_status
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - provider_secret
    egress:
      default: none
    tests_required:
      - no_captured_text_in_capture_logs
      - no_raw_url_or_window_in_diagnostics

  - id: data.export
    class: unknown
    status: implemented_jsonl
    source: local memory DB
    captured_fields:
      - decrypted_observations
      - decrypted_content_blobs
      - metadata
    egress:
      default: user_selected_destination
      warning: destination may be cloud-synced outside OpenBird control
    controls_active:
      - explicit_destination_warning
      - no_tempfile_leak
      - output_file_mode_0600
    controls_planned:
      - optional_encrypted_export
    truth_surface:
      - cli.export_warning
      - app.export_warning
