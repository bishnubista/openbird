# Machine-readable companion to docs/design/privacy-data-flow.md.
# Keep route ids stable; tests and UI copy may reference them.
version: 1
route_classes:
  local:
    description: Runtime data stays on this Mac.
    egress: false
  self-hosted-remote:
    description: Data leaves this Mac for user-controlled infrastructure.
    egress: true
  third-party-cloud:
    description: Data leaves this Mac for a third-party provider.
    egress: true
  unknown:
    description: OpenBird cannot prove the route.
    egress: true
    release_green: false

release_policy:
  public_beta_requires_verified_sqlcipher: true
  plaintext_0600_release_green: false
  unknown_route_release_green: false

routes:
  - id: capture.active_window
    class: local
    source: Swift Accessibility helper
    captured_fields:
      - bundle_id
      - window_title_sanitized_before_storage
      - active_window_text
      - timestamp
      - incognito_flag
    storage:
      - sqlite.observations
      - sqlite.content_blobs
      - sqlite.chunks
      - sqlite.fts_chunks
      - sqlite.vec_chunks
    egress:
      default: none
      inherited_by:
        - chat.remote
        - routines.summary
    enforcement:
      detailed_local_capture: exact per-app terminal/editor grant may bypass only the default sensitive-app block; allowlist, dangerous-app, self-capture, private-window, secure-field, and verified-SQLCipher gates remain fail-closed
      detailed_capture_encryption: any non-empty detailed-capture grant forces strict SQLCipher and refuses plaintext fallback
      failure_mode: fail_closed
    deletion:
      command: openbird data purge/prune
      must_remove:
        - observations
        - orphaned_content_blobs
        - orphaned_chunks
        - fts_rows
        - vector_rows
    truth_surface:
      - app.capture_state
      - app.detailed_local_capture_section
      - app.dataDeletionCommandRow
      - preflight.privacy

  - id: capture.ocr_window
    class: local
    source: Swift helper — SCScreenshotManager window still + on-device Vision OCR (opt-in per app)
    derives_from:
      - capture.active_window
    captured_fields:
      - bundle_id
      - window_title_sanitized_before_storage
      - recognized_text_scrubbed_before_storage
      - timestamp
    pixels: held in memory only — the CGImage never persists to disk and is never logged (helper file-header invariant); only recognized text leaves the helper, over the same private pipe as AX text
    storage:
      - sqlite.observations
      - sqlite.content_blobs
      - sqlite.chunks
      - sqlite.fts_chunks
      - sqlite.vec_chunks
    egress:
      default: none
      inherited_by:
        - chat.remote
        - routines.summary
    enforcement:
      boundary: Swift helper OcrGate — per-app opt-in after the allowlist gate; CGPreflightScreenCaptureAccess only (never prompts); mic-hot suppressed; per-app throttled
      failure_mode: fail_closed
    deletion:
      command: openbird data purge/prune
      must_remove:
        - observations
        - orphaned_content_blobs
        - orphaned_chunks
        - fts_rows
        - vector_rows
    truth_surface:
      - app.capture_state
      - app.deep_capture_section
      - app.dataDeletionCommandRow
      - preflight.privacy

  - id: capture.pause
    class: local
    source: capture.paused sidecar
    captured_fields: []
    storage: []
    egress:
      default: none
    enforcement:
      boundary: Swift helper before AX read
      failure_mode: fail_closed
    truth_surface:
      - app.capture_pause_state
      - menu_bar.pause_state

  - id: ingest.files
    class: local
    source: user-selected local files
    captured_fields:
      - extracted_text
      - source_path_metadata
      - timestamp
    storage:
      - sqlite.observations
      - sqlite.content_blobs
      - sqlite.chunks
      - sqlite.fts_chunks
      - sqlite.vec_chunks
    egress:
      default: none
      inherited_by:
        - embedding.remote
        - chat.remote
    truth_surface:
      - cli.ingest_output

  - id: chat.local
    class: local
    source: user prompt plus retrieved local memory
    captured_fields:
      - user_question
      - retrieved_chunks
      - citations
    storage: []
    egress:
      condition: active_model_route_is_loopback
      default: none
    truth_surface:
      - cli.cloud_banner
      - app.privacyTransmissionSummary

  - id: chat.day_facts
    class: local
    source: deterministic RAG day-fact answer branch over persisted day-memory productivity facts; not every metric-looking question
    derives_from:
      - productivity.local_facts
    captured_fields:
      - user_question_for_classification_only
      - active_seconds
      - active_minutes
      - context_switch_count
      - top_category
      - top_hour
      - longest_focus_block
      - derived_citation_source_ids
      - memory_context_counts
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
      - source_ids_in_memory_context
    storage:
      - sqlite.day_memories
    egress:
      default: none
      note: explicit day-scoped branch returns before the cloud/embedding provider (_provider) is constructed; the only provider object instantiated on this branch is the non-embedding maintenance stub (_MaintenanceProvider), which raises on embed and complete. Query-inferred day branch may construct a provider before RAG, but returns before provider.complete. No completion or embedding request is issued on either branch.
    truth_surface:
      - cli.chat_json.reasoning_route
      - app.ChatResult.routeLabel

  - id: chat.day_memory
    class: local
    source: deterministic RAG day-memory synthesis branch over persisted day-memory distillation; not specific/content lookups
    derives_from:
      - capture.active_window
    captured_fields:
      - user_question_for_classification_only
      - distilled_day_memory_metrics
      - workstreams
      - sessions
      - open_loops
      - domains
      - repos
      - derived_citation_source_ids
      - memory_context_counts
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
      - source_ids_in_memory_context
    storage:
      - sqlite.day_memories
    egress:
      default: none
      note: explicit day-scoped branch returns before the cloud/embedding provider (_provider) is constructed; the only provider object instantiated on this branch is the non-embedding maintenance stub (_MaintenanceProvider), which raises on embed and complete. Query-inferred day branch may construct a provider before RAG, but returns before provider.complete. No completion or embedding request is issued on either branch.
    truth_surface:
      - cli.chat_json.reasoning_route
      - app.ChatResult.routeLabel

  - id: chat.day_memory_cached_summary
    class: local
    source: deterministic day answer composed with precomputed local-model block-summary narrative
    derives_from:
      - chat.day_memory
      - summaries.block
    captured_fields:
      - distilled_day_memory_metrics
      - stored_block_summary_prose
      - block_summary_derived_citations
      - derived_citation_typed_source_refs
      - memory_context_counts
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
      - source_ids_in_memory_context
    storage:
      - sqlite.day_memories
      - sqlite.block_summaries
    egress:
      default: none
      note: composition is an answer-time local read — no provider call and no embedding request; the narrative prose was generated EARLIER by the local model under the routines battery/idle gate (summaries.block). Absent summaries the answer stays byte-identical chat.day_memory (local_deterministic).
    truth_surface:
      - cli.chat_json.reasoning_route
      - app.ChatResult.routeLabel
      - app.DayBriefing.routeLabel

  - id: chat.week_memory_cached_summary
    class: local
    source: cached week answer composed from the stored week digest, per-day block-summary narratives, and deterministic totals from stored day memories
    derives_from:
      - chat.day_memory_cached_summary
      - summaries.week
    captured_fields:
      - stored_week_digest_prose
      - stored_block_summary_prose
      - deterministic_day_totals
      - week_memory_derived_citations
      - derived_citation_typed_source_refs
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
    storage:
      - sqlite.day_memories
      - sqlite.block_summaries
    egress:
      default: none
      note: answer-time local composition — no provider call and no embedding request; the digest/narrative prose was generated EARLIER by the local-route model under the routines battery/idle gate (summaries.week / summaries.block). Absent cached prose the query falls through to chat.summary_grounded or the raw-row paths, which report their own routes.
    truth_surface:
      - cli.chat_json.reasoning_route
      - app.ChatResult.routeLabel
      - cli.briefing_week

  - id: chat.summary_grounded
    class: unknown
    source: fresh model completion for multi-day questions grounded in cached derived summary prose (block summaries + overlapping week digests) instead of raw rows
    derives_from:
      - summaries.block
      - summaries.week
      - chat.local
      - chat.remote
    captured_fields:
      - user_question
      - stored_block_summary_prose_fenced
      - stored_week_digest_prose_fenced
      - derived_citations
    storage:
      - local_db_for_retrieval_only
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      warning: cached derived-sensitive summary prose enters the completion prompt and leaves this machine only under the active model route with cloud opt-in — same class as retrieved_chunks
    truth_surface:
      - cli.chat_json.reasoning_route
      - app.ChatResult.routeLabel
      - cli.CLOUD_ACTIVE

  - id: summaries.block
    class: local
    source: idle-time routines worker summarizing settled focus blocks over spans and policy-accepted observations
    derives_from:
      - capture.active_window
    captured_fields:
      - span_metadata_lines
      - captured_text_excerpts_fenced
      - generated_block_summary_prose
      - validated_typed_citations
      - taxonomy_identity_levels
    forbidden_fields:
      - summary_text_in_logs
      - summary_text_in_routine_output
      - captured_text_in_logs
    storage:
      - sqlite.block_summaries
      - sqlite.category_assignments
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      note: generation runs ONLY under the battery/idle gate in the routines daemon (or explicit `openbird summaries build`); the shared LLMProvider's CloudOptInRequired enforcement is the cloud gate — a cloud-opted user has opted this path in. Routine output and logs carry counts + reason codes only.
    deletion:
      command: openbird data purge/prune
      must_remove:
        - block_summaries_citing_deleted_sources
        - day_memories_citing_deleted_summaries
        - category_assignments_on_full_purge
        - summary_index_entries_and_fts_vec_rows
    truth_surface:
      - cli.summaries_list
      - routine_run_output

  - id: summaries.week
    class: local
    source: idle-time routines worker reducing a week's stored block-summary narratives into one digest (day_memories row with source_scope='week')
    derives_from:
      - summaries.block
    captured_fields:
      - per_day_metadata_header_lines
      - block_summary_prose_fenced
      - generated_week_digest_prose
      - validated_summary_kind_citations
      - member_fingerprint
    forbidden_fields:
      - digest_text_in_logs
      - digest_text_in_routine_output
      - summary_text_in_logs
    storage:
      - sqlite.day_memories
      - sqlite.summary_index_entries
      - sqlite.fts_summaries
      - sqlite.vec_summaries
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      note: generation runs ONLY under the battery/idle gate in the routines daemon (or explicit `openbird summaries build`); the shared LLMProvider's CloudOptInRequired enforcement is the cloud gate — a cloud-opted user has opted this path in. Zero valid citations means nothing is stored (week_memory_ungrounded). Routine output and logs carry counts + reason codes only; digest/summary text never logged.
    deletion:
      command: openbird data purge/prune
      must_remove:
        - week_rows_citing_deleted_block_summaries
        - summary_index_entries_and_fts_vec_rows
    truth_surface:
      - cli.summaries_list
      - routine_run_output

  - id: entities.aggregation
    class: local
    source: deterministic idle-time aggregation mining the entity ledger from stored observations, spans, block summaries, and day-memory open-loop payloads (regex only, structurally no model)
    derives_from:
      - capture.active_window
      - summaries.block
    captured_fields:
      - entity_names_and_aliases
      - completion_evidence_details
      - typed_source_refs
      - aggregation_watermarks
    forbidden_fields:
      - entity_names_in_logs
      - entity_names_in_routine_output
      - evidence_details_in_logs
      - evidence_details_in_routine_output
    storage:
      - sqlite.entities
      - sqlite.entity_evidence
    egress:
      default: none
      note: STRUCTURALLY no model — run_entity_aggregation takes no provider argument, so no completion or embedding request can be issued; every evidence row is a regex match over a stored, citable source. Runs only under the routines battery/idle/meeting gate (or explicit `openbird summaries build`). Logs and routine output carry counts + reason codes only.
    deletion:
      command: openbird data purge/prune
      must_remove:
        - entity_evidence_citing_deleted_sources
        - evidence_less_entities_marked_dormant_in_same_transaction
        - entities_and_evidence_on_full_purge
        - entity_aggregation_watermarks_on_full_purge
    truth_surface:
      - cli.entities_list
      - routine_run_output

  - id: chat.entity_ledger
    class: local
    source: deterministic completion answer ("did I finish X") composed from stored entity-ledger evidence rows; zero entity matches fall through to the normal chat routes
    derives_from:
      - entities.aggregation
    captured_fields:
      - user_question_for_classification_only
      - entity_name_and_aliases
      - completion_evidence_lines
      - entity_evidence_derived_citations
      - typed_last_seen_ref
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
    storage:
      - sqlite.entities
      - sqlite.entity_evidence
    egress:
      default: none
      note: terminal deterministic branch — zero provider calls (reasoning_route local_deterministic); ambiguity returns a candidate list, never a guess. A windowed question filters evidence and last-activity to the window. Queries with no ledger match fall through to routes that report their own egress.
    truth_surface:
      - cli.chat_json.reasoning_route
      - app.ChatResult.routeLabel

  - id: deep_brain.preview
    class: local
    source: exclusion-filtered day/week memory plus selected cited snippets
    captured_fields:
      - distilled_day_memory_content
      - distilled_day_or_week_memory_content
      - period_metadata
      - selected_citation_snippets
      - selected_source_observation_id
      - selected_source_app
      - selected_source_window_or_url
      - selected_source_timestamp
      - packet_build_route
      - exclusion_counts
      - exclusion_metadata
      - opt_in_gate_status
    storage: []
    egress:
      default: none
      note: local preview only; no provider is constructed
    truth_surface:
      - cli.deep_brain_preview
      - app.deepBrainPreviewRow

  - id: deep_brain.status
    class: local
    source: Deep Brain opt-in and exclusion settings
    captured_fields:
      - opt_in_gate_status
      - exclusion_metadata
      - configured_exclusion_counts
    storage: []
    egress:
      default: none
      note: local settings read only; no provider, store, or packet is constructed
    truth_surface:
      - cli.deep_brain_status
      - app.deepBrainStatusRow

  - id: deep_brain.ask
    class: unknown
    source: user question plus exclusion-filtered day/week memory packet
    captured_fields:
      - user_question
      - distilled_day_memory_content
      - distilled_day_or_week_memory_content
      - period_metadata
      - selected_citation_snippets
      - selected_source_observation_id
      - selected_source_app
      - selected_source_window_or_url
      - selected_source_timestamp
      - packet_build_route
      - generated_answer
      - validated_citations
      - exclusion_counts
      - exclusion_metadata
    storage:
      - sqlite.reasoning_send_ledger_metadata
    forbidden_fields:
      - ledger_raw_question
      - ledger_generated_answer
      - ledger_packet_json
      - ledger_snippets
      - ledger_observation_ids
      - ledger_citation_ids
      - ledger_configured_exclusion_names
      - ledger_source_app_names
      - ledger_url_or_window_title_metadata
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      warning: packet content leaves this machine when the active model route is remote
    enforcement:
      feature_requires: OPENBIRD_DEEP_BRAIN_ENABLED
      note: Feature gate covers Deep Brain ask and productivity coaching.
    truth_surface:
      - cli.deep_brain_ask
      - app.deepBrainAskCommandRow
      - cli.CLOUD_ACTIVE
      - cli.data_reasoning_ledger

  - id: briefing.model
    class: unknown
    source: explicit model-written briefing over exclusion-filtered distilled day memory packet
    captured_fields:
      - model_briefing_prompt
      - distilled_day_memory_content
      - selected_citation_snippets
      - selected_source_observation_id
      - selected_source_app
      - selected_source_window_or_url
      - selected_source_timestamp
      - packet_build_route
      - packet_route
      - packet_preview_egress_label
      - packet_local_date
      - packet_day_offset
      - packet_source_scope
      - opt_in_gate_status
      - generated_briefing
      - validated_citations
      - exclusion_counts
      - exclusion_metadata
    storage:
      - sqlite.reasoning_send_ledger_metadata
    forbidden_fields:
      - ledger_raw_question
      - ledger_generated_briefing
      - ledger_packet_json
      - ledger_snippets
      - ledger_observation_ids
      - ledger_citation_ids
      - ledger_configured_exclusion_names
      - ledger_source_app_names
      - ledger_url_or_window_title_metadata
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      warning: distilled day memory plus selected snippets leave this machine when the active LLM route is remote
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
      note: The --model flag is the feature opt-in for model-written briefings; no OPENBIRD_DEEP_BRAIN_ENABLED gate is required.
    truth_surface:
      - cli.briefing_model
      - cli.CLOUD_ACTIVE
      - cli.data_reasoning_ledger

  - id: productivity.local_facts
    class: local
    source: deterministic day-memory metrics and source references
    captured_fields:
      - active_seconds
      - active_minutes
      - context_switch_count
      - context_switches_per_active_hour
      - top_category
      - top_hour
      - focus_blocks
      - category_sources
      - source_ids
      - coach_ready_packet_without_source_ids
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
    storage:
      - sqlite.day_memories
    egress:
      default: none
      note: no provider is constructed; coaching packets are local read-time projections
    truth_surface:
      - cli.productivity

  - id: productivity.coach
    class: unknown
    source: user question plus exclusion-filtered sanitized local productivity facts packet
    captured_fields:
      - user_question
      - productivity_facts
      - synthetic_citation_ids
      - generated_coaching
      - validated_citations_local_source_ids
      - exclusion_counts
      - exclusion_metadata
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - raw_title
      - source_ids_in_prompt
      - observation_ids_in_prompt
      - ledger_raw_question
      - ledger_generated_coaching
      - ledger_packet_json
      - ledger_observation_ids
      - ledger_citation_ids
      - ledger_configured_exclusion_names
      - ledger_source_app_names
      - ledger_url_or_window_title_metadata
    storage:
      - sqlite.reasoning_send_ledger_metadata
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
      warning: sanitized productivity facts leave this machine when the active model route is remote
    enforcement:
      feature_requires: OPENBIRD_DEEP_BRAIN_ENABLED
      note: Same frontier-reasoning gate as Deep Brain ask; cloud egress still requires OPENBIRD_ALLOW_CLOUD when the active LLM is remote.
    truth_surface:
      - cli.productivity_coach
      - app.productivityCoachCommandRow
      - cli.CLOUD_ACTIVE
      - cli.data_reasoning_ledger

  - id: chat.remote
    class: unknown
    source: user prompt plus retrieved local memory
    captured_fields:
      - user_question
      - retrieved_chunks
      - citations
    storage:
      - local_db_for_retrieval_only
    egress:
      default: active_model_route
      resolved_by:
        - model.remote_ollama
        - model.third_party_cloud
      warning: captured memory leaves this machine
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: assistant.mcp_read
    class: third-party-cloud
    status: implemented_stdio_read_only
    source: assistant-invoked bounded local SQLite or FTS capture read
    derives_from:
      - capture.active_window
      - capture.ocr_window
    captured_fields:
      - exclusion_filtered_capture_excerpt
      - app_bundle_id
      - timestamp
      - source
      - observation_id
      - capture_host_label
    forbidden_fields:
      - raw_url
      - raw_window_title
      - unknown_app_observation
      - captured_text_in_logs
    storage:
      - no_new_openbird_storage
      - assistant_provider_request_after_content_tool_invocation
    egress:
      default: none_until_content_tool_invocation
      destination: connected_assistant_provider
      warning: returned excerpts and metadata leave this Mac and cannot be recalled by local deletion
    enforcement:
      transport: local_stdio_only
      install_requires: explicit warning and interactive confirmation or --yes
      exclusions: deep_brain app, source, and observation-id exclusions before serialization
      bounds: 2000 characters per excerpt and 12000 excerpt characters per call
      model_calls: forbidden
      unknown_app: fail_closed
    deletion:
      command: openbird data purge/prune
      caveat: removes future retrievability only; cannot recall prior assistant payloads
    truth_surface:
      - cli.assistant_install_warning
      - cli.assistant_status
      - mcp.tool_descriptions
      - mcp.egress_notice

  - id: assistant.activity_summary
    class: third-party-cloud
    status: implemented_stdio_read_only
    source: assistant-invoked bounded activity-span aggregation (no content read)
    derives_from:
      - capture.active_window
    captured_fields:
      - app_bundle_id
      - per_app_foreground_seconds
      - per_app_meeting_seconds
      - per_app_span_count
      - afk_seconds
      - context_switch_count
      - focus_block_timestamps
      - folded_tail_app_count_and_seconds
      - redacted_by_app_bundle_id_reason_seconds
      - redacted_second_total
      - redacted_other_seconds_tail
      - redacted_unattributed_seconds
      - unnamed_excluded_second_total
      - resolved_query_window_echo_with_timezone
      - capture_host_label
    forbidden_fields:
      - captured_text
      - window_title
      - url_host
      - identity_key
      - excluded_bundle_id
      - observation_derived_statistics
    storage:
      - no_new_openbird_storage
      - assistant_provider_request_after_tool_invocation
    egress:
      default: none_until_tool_invocation
      destination: connected_assistant_provider
      warning: app usage durations and activity patterns leave this Mac and cannot be recalled by local deletion
    enforcement:
      transport: local_stdio_only
      install_requires: explicit warning and interactive confirmation or --yes
      exclusions: deep_brain app exclusions bucket matching spans into unnamed excluded_seconds before serialization
      bucket_precedence: excluded then redacted then afk then visible, strict first-match per span
      bounds: minutes and range modes bounded to 24h; local_day mode exactly one civil day whose length is timezone-rule-dependent, skipped dates rejected; 5000 spans per window fail-closed; 30 named apps
      model_calls: forbidden
      malformed_exclusion_regex: fail_closed
    deletion:
      command: openbird data purge/prune
      caveat: removes future retrievability only; cannot recall prior assistant payloads
    truth_surface:
      - cli.assistant_install_warning
      - app.assistant_connect_confirmations
      - mcp.tool_descriptions
      - mcp.activity_egress_notice

  - id: assistant.capture_status
    class: third-party-cloud
    status: implemented_stdio_read_only
    source: assistant-invoked metadata-only store status read (no content, no spans)
    derives_from:
      - capture.active_window
    captured_fields:
      - observation_total_count
      - encryption_enabled_flag
      - exclusion_config_counts
      - capture_host_label
    forbidden_fields:
      - captured_text
      - window_title
      - url_host
      - bundle_id
      - observation_ids
    storage:
      - no_new_openbird_storage
      - assistant_provider_request_after_tool_invocation
    egress:
      default: none_until_tool_invocation
      destination: connected_assistant_provider
      warning: store totals, encryption state, exclusion counts, and the host label leave this Mac and cannot be recalled by local deletion
    enforcement:
      transport: local_stdio_only
      install_requires: explicit warning and interactive confirmation or --yes
      counts_scope: store-lifetime totals, never windowed activity
      model_calls: forbidden
    deletion:
      command: openbird data purge/prune
      caveat: removes future retrievability only; cannot recall prior assistant payloads
    truth_surface:
      - cli.assistant_install_warning
      - app.assistant_connect_confirmations
      - mcp.tool_descriptions
      - mcp.status_egress_notice

  - id: routines.summary
    class: unknown
    source: scheduled time-window retrieval over local memory
    captured_fields:
      - retrieved_window_memory
      - routine_prompt
      - generated_summary
    storage:
      - routine_output_store_when_enabled
    egress:
      default: inherits_active_model_route
      inherited_from:
        - chat.local
        - chat.remote
    truth_surface:
      - routine_run_output
      - cli.cloud_banner

  - id: meetings.audio
    class: local
    status: planned
    source: ScreenCaptureKit/audio helper
    captured_fields:
      - audio_frames
      - transcript_text
      - speaker_metadata
    storage:
      - local_transcript_store_when_enabled
      - sqlite.observations
      - sqlite.content_blobs
      - sqlite.chunks
    egress:
      default: none
      remote_stt_requires_future_route: true
    truth_surface:
      - preflight.audio
      - app.meeting_privacy_state

  - id: model.local_ollama
    class: local
    source: retrieved memory and user prompt
    egress:
      condition: ollama_host_is_loopback
      default: none
    truth_surface:
      - preflight.cloud
      - cli.cloud_banner
      - app.privacyTransmissionSummary

  - id: model.remote_ollama
    class: self-hosted-remote
    source: retrieved memory and user prompt
    egress:
      condition: ollama_host_is_not_loopback
      default: off_device
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: model.third_party_cloud
    class: third-party-cloud
    source: retrieved memory and user prompt
    egress:
      condition: provider_is_not_local
      default: third_party_provider
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: embedding.remote
    class: unknown
    source: local memory chunks sent for embedding
    captured_fields:
      - chunk_text
      - embedding_request_metadata
    storage:
      - sqlite.vec_chunks
    egress:
      default: active_embedding_route
      resolved_by:
        - model.remote_ollama
        - model.third_party_cloud
      warning: captured chunks leave this machine
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE

  - id: rerank.remote
    class: unknown
    source: user query plus retrieved local memory chunks sent to a cross-encoder
    captured_fields:
      - user_question
      - retrieved_chunk_text
      - rerank_request_metadata
    storage:
      - local_db_for_retrieval_only
    egress:
      condition: rerank_host_is_not_loopback
      default: active_rerank_route
      resolved_by:
        - model.remote_ollama
        - model.third_party_cloud
      warning: query and candidate chunk text leave this machine
    enforcement:
      requires: OPENBIRD_ALLOW_CLOUD
    truth_surface:
      - preflight.cloud
      - cli.CLOUD_ACTIVE
      - app.CLOUD_ACTIVE

  - id: diagnostics.logs
    class: local
    source: runtime diagnostics
    captured_fields:
      - reason_codes
      - counts
      - safe_status
    forbidden_fields:
      - captured_text
      - raw_window_title
      - raw_url
      - provider_secret
    egress:
      default: none
    tests_required:
      - no_captured_text_in_capture_logs
      - no_raw_url_or_window_in_diagnostics

  - id: data.export
    class: unknown
    status: implemented_jsonl
    source: local memory DB
    captured_fields:
      - decrypted_observations
      - decrypted_content_blobs
      - metadata
    egress:
      default: user_selected_destination
      warning: destination may be cloud-synced outside OpenBird control
    controls_active:
      - explicit_destination_warning
      - no_tempfile_leak
      - output_file_mode_0600
    controls_planned:
      - optional_encrypted_export
    truth_surface:
      - cli.export_warning
      - app.export_warning
