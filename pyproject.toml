[project]
name = "openbird"
version = "0.1.0"
description = "OpenBird — open-source, local-first personal memory for macOS"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "litellm>=1.50",
    "sqlite-vec>=0.1.6",
    "apscheduler>=3.10",
    "platformdirs>=4.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavy: pulls PyTorch. Only needed for meeting transcription.
meetings = ["faster-whisper>=1.0"]
# Heavy: cross-encoder reranker. Optional retrieval quality boost.
rerank = ["sentence-transformers>=3.0"]
# SQLCipher storage gate and macOS Keychain-backed DB key storage.
encryption = ["sqlcipher3-wheels>=0.5.7", "keyring>=25.7"]
# MCP integration clients.
integrations = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
openbird = "openbird.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbird"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (e.g. a running Ollama); auto-skip when unavailable",
]

[tool.ruff]
# 100 matches the existing codebase: only 2 lines exceed it today, vs 59 over 88.
# Picking 100 keeps formatter adoption from churning unrelated code.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# First-adoption set: real errors only, no style opinions that would churn
# working code. E/F = pycodestyle + pyflakes (undefined names, unused imports),
# I = import sorting. Opinionated families (B/UP/SIM) are a deliberate follow-up.
select = ["E", "F", "I"]
# E501 (line too long) is enforced by the formatter, not the linter.
ignore = ["E501"]
