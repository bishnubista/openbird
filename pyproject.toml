[project]
name = "openbird"
version = "0.5.1"
description = "OpenBird — open-source, local-first personal memory for macOS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "litellm>=1.50",
    "sqlite-vec>=0.1.6",
    "apscheduler>=3.10",
    "platformdirs>=4.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13.7",
    "tenacity>=8.0",
]

[project.optional-dependencies]
# Heavy: pulls PyTorch. Portable (CPU) meeting-transcription fallback backend.
meetings = ["faster-whisper>=1.0"]
# Preferred meeting-transcription backend on Apple Silicon (NVIDIA Parakeet via
# the MLX port). Platform-marked to Darwin+arm64 so Linux/CI never resolves it,
# even under `uv sync --all-extras` or a lock refresh.
meetings-mlx = [
    "parakeet-mlx>=0.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Heavy: cross-encoder reranker. Optional retrieval quality boost.
rerank = ["sentence-transformers>=3.0"]
# SQLCipher storage gate and macOS Keychain-backed DB key storage.
encryption = ["sqlcipher3-wheels>=0.5.7", "keyring>=25.7"]
# MCP integration clients.
integrations = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
openbird = "openbird.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbird"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (e.g. a running Ollama); auto-skip when unavailable",
]
